    function mod(x,y) {
      return (x%y+y)%y
    }
    function mdis(p1x, p1y, p2x, p2y) {
      let dx = Math.abs(mod(p1x,500)-mod(p2x,500))
      let dy = Math.abs(mod(p1y,500)-mod(p2y,500))

      return Math.hypot(dx,dy)
    }
    function draw4(c,x,y,xs,ys) {
      let cnx = c.getContext("2d")
      let xm = mod(x-xs/2,500)
      let ym = mod(y-ys/2,500)
      cnx.fillRect(xm,ym,xs,ys)
      cnx.fillRect(xm-500,ym,xs,ys)
      cnx.fillRect(xm,ym-500,xs,ys)
      cnx.fillRect(xm-500,ym-500,xs,ys)
    }
    function squ() {
      document.getElementById("namesel").innerHTML = squn.filter((v)=>{return v.startsWith(document.getElementById("name").value)})
      let cnv = document.getElementById("canvas")
      let cnx = cnv.getContext("2d")
      ste++
      cnx.clearRect(0,0,500,500)
      cnx.fillStyle="#ffffff"
      cnx.fillRect(0,0,500,500)
      if (Math.random() < 0.001) objs.push([0,0,0,100*(Math.random()-0.5),100*(Math.random()-0.5),{},true])
      squs=squs.filter((v) => {return v[6] > 0})
      for (let i = 0; i < squs.length; i++) {
        if (squs[i][0] < 0 || squs[i][0] >= squn.length) {
          squs[i][0] = Math.floor(Math.random()*squn.length)
        }
        squs[i][6]-=Math.hypot(squs[i][4], squs[i][5])/100
        squs[i][2]+=squs[i][4]
        squs[i][3]+=squs[i][5]
        squs[i][4]/=1.1
        squs[i][5]/=1.1
        if (Math.random() < 0.003) {
          squs[i][4]+=10*(Math.random()-0.5)
          squs[i][5]+=10*(Math.random()-0.5)
        }
        squs[i][1] = (Math.round(Math.atan2(-squs[i][5], squs[i][4])/Math.PI*2)+4)%4
        for (let j = 0; j < squm[squs[i][0]][squs[i][1]].length/5; j++) {
          cnx.fillStyle="#"+squm[squs[i][0]][squs[i][1]][j*5]
          if (sel && seln==i && new Date().getTime()%1000 < 500) {
            cnx.fillStyle="#7f7f7f"
          }
          draw4(cnv, squs[i][2]+squm[squs[i][0]][squs[i][1]][j*5+1], squs[i][3]+squm[squs[i][0]][squs[i][1]][j*5+2], squm[squs[i][0]][squs[i][1]][j*5+3], squm[squs[i][0]][squs[i][1]][j*5+4])

        objs[i][2] += objs[i][4]

        objs[i][4]/=1.1

        }
