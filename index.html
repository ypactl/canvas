<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squarie Canvas Simulation</title>
</head>
<body>
  <canvas id="canvas" width="500" height="500"></canvas>
  <button onclick="let n = document.getElementById('name').value;if(!squn.includes(n)){document.getElementById('name').value=squn[0]}else{document.getElementById('name').value=(squn.indexOf(document.getElementById('name').value)-1+squn.length)%squn.length}">«</button><label for="name"></label><input id="name" type="text" value=""><button onclick="let n = document.getElementById('name').value;if(!squn.includes(n)){document.getElementById('name').value=squn[0]}else{document.getElementById('name').value=(squn.indexOf(document.getElementById('name').value)+1)%squn.length}">»</button>
  <button onclick="squs.push([squn.indexOf(document.getElementById('name')),3,Math.random()*500,Math.random()*500,0,0])">Add</button>
  <button onclick="sel=!sel;seln=0">Select</button>
  <button onclick="seln=(seln-1+squs.length)%squs.length">«</button><button onclick="seln=(seln+1)%squs.length">»</button>
  <button onclick="if(sel)squs.splice(seln,1)">Delete</button>
  <script>
    var squs=[
      [0,0,200,250,0,0],
      [1,0,300,250,0,0]
    ]
    var squm=[
      [["000000",0,0,20,20,"ffbf00",5,0,10,10],["000000",0,0,20,20,"ffbf00",0,-5,10,10],["000000",0,0,20,20,"ffbf00",-5,0,10,10],["000000",0,0,20,20,"ffbf00",0,5,10,10]],
      [["000000",0,0,20,20,"009eaa",5,0,10,10],["000000",0,0,20,20,"009eaa",0,-5,10,10],["000000",0,0,20,20,"009eaa",-5,0,10,10],["000000",0,0,20,20,"009eaa",0,5,10,10]]
    ]
    var squn = [
      "GoldTest",
      "TealTest"
    ]
    var sel=false
    var seln=0
    function draw4(c,x,y,xs,ys) {
      let cnx = c.getContext("2d")
      let xm = x-xs/2
      let ym = y-ys/2
      xm = (xm%500+500)%500
      ym = (ym%500+500)%500
      cnx.fillRect(xm,ym,xs,ys)
      cnx.fillRect(xm-500,ym,xs,ys)
      cnx.fillRect(xm,ym-500,xs,ys)
      cnx.fillRect(xm-500,ym-500,xs,ys)
    }
    function squ() {
      let cnv = document.getElementById("canvas")
      let cnx = cnv.getContext("2d")
      cnx.clearRect(0,0,500,500)
      for (let i = 0; i < squs.length; i++) {
        squs[i][2]+=squs[i][4]
        squs[i][3]+=squs[i][5]
        squs[i][4]/=1.01
        squs[i][5]/=1.01
        if (Math.random() < 0.003) {
          squs[i][4]+=(Math.random()-0.5)
          squs[i][5]+=(Math.random()-0.5)
        }
        squs[i][1] = (Math.round(Math.atan2(-squs[i][5], squs[i][4])/Math.PI*2)+4)%4
        for (let j = 0; j < squm[squs[i][0]][squs[i][1]].length/5; j++) {
          cnx.fillStyle="#"+squm[squs[i][0]][squs[i][1]][j*5]
          if (sel && seln==i && new Date().getTime()%1000 < 500) {
            cnx.fillStyle="#7f7f7f"
          }
          draw4(cnv, squs[i][2]+squm[squs[i][0]][squs[i][1]][j*5+1], squs[i][3]+squm[squs[i][0]][squs[i][1]][j*5+2], squm[squs[i][0]][squs[i][1]][j*5+3], squm[squs[i][0]][squs[i][1]][j*5+4])
        }
      }
      cnx.fillStyle="#000000"
      cnx.fillText(squs[seln].map(Math.round), 0, 10)
    }
    setInterval(squ,20)
  </script>
</body>
